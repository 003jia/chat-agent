# dsh-codex-provider bundle patch
#
# 声明 `dsh.bundle.patch` 的包会被 `dsh plugin --profile web add <path>` 自动并入
# bundles 层（无需手改 profile 的 bundles 列表）。本 patch 做两件事：
#
# 1. 替换 `llm-pi-ai` 行的 config（patch 语义为整行替换），把本机 Codex 桥接
#    注册为 OpenAI 兼容供应商路由 `codex`，模型含 gpt-5.6-sol（xhigh/max 档位）。
#    用户 settings.yaml 的 `llm-pi-ai:` 分节按 provider 逐项合并覆盖，互不冲突。
# 2. insert 一个运行时入口行 `codex-provider`，由 DSH 加载 index.mjs：
#    启动时自动拉起桥接子进程，退出时自动清理；若 8899 已有桥接则直接复用。

- id: llm-pi-ai
  config:
    providers:
      codex:
        apiKeyEnv: CODEX_LOCAL_KEY
        displayName: Codex (GPT-5.6)
        api: openai-completions
        baseURL: http://127.0.0.1:8899/v1
        defaultContextWindow: 272000
        defaultMaxTokens: 32768
        models:
          - id: gpt-5.6-sol
            name: GPT-5.6 Sol
            contextWindow: 272000
            maxTokens: 32768
            reasoningEfforts:
              off:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: gpt-5.6-luna
            name: GPT-5.6 Luna
          - id: gpt-5.6-terra
            name: GPT-5.6 Terra
          - id: gpt-5.5
            name: GPT-5.5

- insert:
    - id: codex-provider
      name: dsh-codex-provider
